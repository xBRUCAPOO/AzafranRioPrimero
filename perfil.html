<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil del cliente — Gestor de Clientes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar topbar--perfil">
      <button class="btn btn--ghost" onclick="window.location.href='index.html'">
        <span class="material-symbols-outlined">arrow_back</span> Volver al listado
      </button>
    </header>

    <main class="content perfil-content">
      <div class="perfil-card">
        <div class="perfil-card__header">
          <span class="material-symbols-outlined perfil-card__icon" id="perfilSexIcon">face</span>
          <h1 id="perfilNombre">Cargando...</h1>
        </div>

        <!-- Cada dato tiene su propio botón de copiar individual -->
        <div id="perfilGrid" class="view-grid"></div>
        <div id="perfilCoowners" class="view-coowners"></div>

        <div class="perfil-actions">
          <!-- Copia TODOS los datos del perfil de una sola vez -->
          <button type="button" id="copyAllBtn" class="btn btn--ghost">
            <span class="material-symbols-outlined">content_copy</span> Copiar perfil completo
          </button>
          <div class="perfil-actions-right">
            <button type="button" id="deleteBtn" class="btn btn--danger">
              <span class="material-symbols-outlined">delete</span> Eliminar
            </button>
            <button type="button" id="editBtn" class="btn btn--primary">
              <span class="material-symbols-outlined">edit</span> Editar
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span class="footer__brand">xBRUCAPOO</span>
      <span class="footer__sep">·</span>
      <span>v1.1.0</span>
      <span class="footer__sep">·</span>
      <span>Actualizado 31/08/2026</span>
    </footer>
  </div>

  <!-- Modal de edición: EXACTAMENTE el mismo formulario flotante de siempre -->
  <div id="clientModal" class="modal hidden">
    <div class="modal__overlay" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__header">
        <h2 id="modalTitle">Editar cliente</h2>
        <button class="icon-btn" data-close aria-label="Cerrar">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form id="clientForm" class="client-form">
        <input type="hidden" id="clientId" />

        <fieldset class="client-form__section">
          <legend>Datos del cliente</legend>

          <label class="field">
            <span>Nombre y Apellido *</span>
            <input type="text" id="f_nombre" maxlength="150" required />
          </label>

          <label class="field">
            <span>Sexo *</span>
            <select id="f_sexo" required>
              <option value="M">Hombre</option>
              <option value="F">Mujer</option>
            </select>
          </label>

          <label class="field">
            <span>DNI</span>
            <!-- Un DNI argentino no supera los 8 dígitos -->
            <input type="text" id="f_dni" inputmode="numeric" maxlength="8" />
          </label>

          <label class="field">
            <span>CUIL</span>
            <!-- CUIL: 11 dígitos (sin guiones) -->
            <input type="text" id="f_cuil" inputmode="numeric" maxlength="11" />
          </label>

          <label class="field">
            <span>Fecha de nacimiento</span>
            <input type="date" id="f_fechaNacimiento" />
          </label>

          <label class="field">
            <span>Teléfono</span>
            <input type="tel" id="f_telefono" maxlength="20" />
          </label>

          <label class="field">
            <span>Mail</span>
            <input type="email" id="f_mail" maxlength="150" />
          </label>

          <label class="field">
            <span>Fecha de alta</span>
            <input type="date" id="f_fechaAlta" />
          </label>

          <label class="field">
            <span>Estado civil</span>
            <select id="f_estadoCivil">
              <option value="">Sin especificar</option>
              <option value="Soltero/a">Soltero/a</option>
              <option value="Casado/a">Casado/a</option>
              <option value="Divorciado/a">Divorciado/a</option>
              <option value="Viudo/a">Viudo/a</option>
              <option value="Unión convivencial">Unión convivencial</option>
            </select>
          </label>

          <label class="field">
            <span>Profesión</span>
            <input type="text" id="f_profesion" maxlength="100" />
          </label>

          <label class="field field--wide">
            <span>Dirección</span>
            <input type="text" id="f_direccion" maxlength="200" />
          </label>

          <label class="field field--wide">
            <span>Referente</span>
            <input type="text" id="f_referente" maxlength="150" />
          </label>
        </fieldset>

        <fieldset class="client-form__section">
          <legend>Copropietarios (máximo 3)</legend>
          <div id="coownersList" class="coowners-list"></div>
          <button type="button" id="addCoownerBtn" class="text-btn">
            <span class="material-symbols-outlined">person_add</span> Agregar copropietario
          </button>
        </fieldset>

        <div class="client-form__actions">
          <div class="client-form__actions-right" style="margin-left: auto;">
            <button type="button" class="btn btn--ghost" data-close>Cancelar</button>
            <button type="submit" class="btn btn--primary">
              <span class="material-symbols-outlined">save</span> Guardar
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- PRIMER paso de confirmación al eliminar: tarjeta flotante propia
       de la página. Si el usuario confirma acá, recién después aparece
       el "alert" nativo del navegador como SEGUNDA confirmación. -->
  <div id="confirmDeleteCard" class="confirm-card hidden">
    <div class="confirm-card__panel">
      <span class="material-symbols-outlined confirm-card__icon">warning</span>
      <p>¿Estás seguro/a de eliminar a <strong id="confirmDeleteNombre"></strong>?</p>
      <div class="confirm-card__actions">
        <button type="button" id="confirmDeleteCancel" class="btn btn--ghost">Cancelar</button>
        <button type="button" id="confirmDeleteAccept" class="btn btn--danger">Sí, eliminar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/api-clientes.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
