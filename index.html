<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Clientes</title>

  <!-- Tipografías desde Google Fonts: Raleway (títulos) y Nunito Sans (texto general) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <!-- Iconos desde Google Fonts (Material Symbols Outlined) -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- Marca "Gestor de Clientes": queda FIJA en la esquina superior
         izquierda de la pantalla (ver .topbar__brand en el CSS) -->
    <div class="topbar__brand">
      <span class="material-symbols-outlined topbar__brand-icon">diversity_3</span>
      <h1 class="topbar__title">Gestor de Clientes</h1>
    </div>

    <!-- Tuerca de ajustes: queda FIJA en la esquina superior derecha de
         la pantalla, bien separada del buscador y del filtro -->
    <div class="settings-fixed">
      <div class="control-wrap">
        <button id="settingsToggle" class="icon-btn" aria-label="Abrir ajustes" aria-expanded="false">
          <span class="material-symbols-outlined">settings</span>
        </button>
        <div id="settingsPanel" class="floating-panel floating-panel--right hidden">
          <p class="floating-panel__title">Apariencia</p>
          <div class="theme-switch">
            <span class="material-symbols-outlined theme-switch__icon">dark_mode</span>
            <label class="switch" aria-label="Cambiar entre modo oscuro y claro">
              <input type="checkbox" id="themeCheckbox" />
              <span class="switch__track"><span class="switch__thumb"></span></span>
            </label>
            <span class="material-symbols-outlined theme-switch__icon">light_mode</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Barra superior: en el lugar donde antes estaba la marca ahora va
         el botón "Historial"; el buscador + filtro quedan centrados -->
    <header class="topbar">
      <button id="historyBtn" class="history-btn" aria-label="Ver historial de movimientos">
        <span class="material-symbols-outlined">history</span>
        Historial
      </button>

      <div class="topbar__center">
        <!-- Buscador de clientes por nombre -->
        <div class="search-box">
          <span class="material-symbols-outlined search-box__icon">search</span>
          <input
            id="searchInput"
            class="search-box__input"
            type="text"
            placeholder="Buscar por nombre, DNI o mail..."
            autocomplete="off"
          />
        </div>

        <!-- Filtro por sexo y estado civil, al lado del buscador -->
        <div class="control-wrap">
          <button id="filterToggle" class="icon-btn" aria-label="Filtrar clientes" aria-expanded="false">
            <span class="material-symbols-outlined">filter_list</span>
          </button>
          <div id="filterPanel" class="floating-panel hidden">
            <p class="floating-panel__title">Filtrar clientes</p>
            <label class="floating-panel__field">
              <span>Sexo</span>
              <select id="filterSexo">
                <option value="todos">Todos</option>
                <option value="M">Hombre</option>
                <option value="F">Mujer</option>
              </select>
            </label>
            <label class="floating-panel__field">
              <span>Estado civil</span>
              <select id="filterEstadoCivil">
                <option value="todos">Todos</option>
              </select>
            </label>
            <button id="filterClear" class="text-btn">Limpiar filtros</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Listado principal de clientes -->
    <main class="content">
      <ul id="clientList" class="client-list" aria-live="polite"></ul>
      <p id="emptyState" class="empty-state hidden">
        <span class="material-symbols-outlined">person_search</span>
        No se encontraron clientes con esos criterios.
      </p>
    </main>

    <!-- Botón flotante para agregar un nuevo cliente -->
    <button id="addClientBtn" class="fab" aria-label="Agregar cliente">
      <span class="material-symbols-outlined">add</span>
    </button>

    <!-- Footer discreto, abajo a la izquierda, con línea superior -->
    <footer class="footer">
      <span class="footer__brand">xBRUCAPOO</span>
      <span class="footer__sep">·</span>
      <span>v1.1.0</span>
      <span class="footer__sep">·</span>
      <span>Actualizado 31/08/2026</span>
    </footer>
  </div>

  <!-- Modal para AGREGAR un cliente nuevo (la edición de uno existente
       ahora se hace desde perfil.html) -->
  <div id="clientModal" class="modal hidden">
    <div class="modal__overlay" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__header">
        <h2 id="modalTitle">Nuevo cliente</h2>
        <button class="icon-btn" data-close aria-label="Cerrar">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form id="clientForm" class="client-form">
        <fieldset class="client-form__section">
          <legend>Datos del cliente</legend>

          <label class="field">
            <span>Nombre y Apellido *</span>
            <input type="text" id="f_nombre" maxlength="150" required />
          </label>

          <label class="field">
            <span>Sexo *</span>
            <select id="f_sexo" required>
              <option value="M">Hombre</option>
              <option value="F">Mujer</option>
            </select>
          </label>

          <label class="field">
            <span>DNI</span>
            <!-- Un DNI argentino no supera los 8 dígitos -->
            <input type="text" id="f_dni" inputmode="numeric" maxlength="8" />
          </label>

          <label class="field">
            <span>CUIL</span>
            <!-- CUIL: 11 dígitos (sin guiones) -->
            <input type="text" id="f_cuil" inputmode="numeric" maxlength="11" />
          </label>

          <label class="field">
            <span>Fecha de nacimiento</span>
            <input type="date" id="f_fechaNacimiento" />
          </label>

          <label class="field">
            <span>Teléfono</span>
            <input type="tel" id="f_telefono" maxlength="20" />
          </label>

          <label class="field">
            <span>Mail</span>
            <input type="email" id="f_mail" maxlength="150" />
          </label>

          <label class="field">
            <span>Fecha de alta</span>
            <input type="date" id="f_fechaAlta" />
          </label>

          <label class="field">
            <span>Estado civil</span>
            <select id="f_estadoCivil">
              <option value="">Sin especificar</option>
              <option value="Soltero/a">Soltero/a</option>
              <option value="Casado/a">Casado/a</option>
              <option value="Divorciado/a">Divorciado/a</option>
              <option value="Viudo/a">Viudo/a</option>
              <option value="Unión convivencial">Unión convivencial</option>
            </select>
          </label>

          <label class="field">
            <span>Profesión</span>
            <input type="text" id="f_profesion" maxlength="100" />
          </label>

          <label class="field field--wide">
            <span>Dirección</span>
            <input type="text" id="f_direccion" maxlength="200" />
          </label>

          <label class="field field--wide">
            <span>Referente</span>
            <input type="text" id="f_referente" maxlength="150" />
          </label>
        </fieldset>

        <fieldset class="client-form__section">
          <legend>Copropietarios (máximo 3)</legend>
          <div id="coownersList" class="coowners-list"></div>
          <button type="button" id="addCoownerBtn" class="text-btn">
            <span class="material-symbols-outlined">person_add</span> Agregar copropietario
          </button>
        </fieldset>

        <div class="client-form__actions">
          <div class="client-form__actions-right" style="margin-left: auto;">
            <button type="button" class="btn btn--ghost" data-close>Cancelar</button>
            <button type="submit" class="btn btn--primary">
              <span class="material-symbols-outlined">save</span> Guardar
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Aviso corto (toast) para confirmar acciones -->
  <div id="toast" class="toast hidden"></div>

  <!-- api-clientes.js debe cargarse ANTES que app.js: contiene las
       funciones de la API, el modo demo y el registro de historial -->
  <script src="js/api-clientes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
